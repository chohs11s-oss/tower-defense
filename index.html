<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타워 디펜스 — 첫 게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1d29; color: #e8eaf0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px; user-select: none;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #7fd1ff; }
  #hud {
    display: flex; gap: 18px; margin-bottom: 10px; font-size: 15px;
    flex-wrap: wrap; justify-content: center;
  }
  #hud span { background: #262a3b; padding: 6px 12px; border-radius: 6px; }
  .val { font-weight: bold; }
  #gold .val { color: #ffd45e; }
  #lives .val { color: #ff6b6b; }
  #wave .val { color: #7fd1ff; }
  #canvasWrap { position: relative; }
  canvas { border-radius: 10px; display: block; }
  #canvas { background: #232838; border: 2px solid #333a52; border-radius: 10px; }
  #controls { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #3a4266; color: #e8eaf0; border: none;
    padding: 10px 16px; border-radius: 7px; font-size: 14px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #4a5488; }
  button.active { background: #2e7d5b; outline: 2px solid #4fd6a0; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #msg { margin-top: 10px; font-size: 14px; color: #9aa3bd; min-height: 20px; text-align: center; }
  #startBtn { background: #2e7d5b; font-size: 16px; padding: 12px 28px; }
  .big { font-size: 30px; font-weight: bold; }
  #overlay {
    position: absolute; inset: 0; background: rgba(20,22,34,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; gap: 14px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  .hint { font-size: 13px; color: #9aa3bd; line-height: 1.6; max-width: 380px; }
</style>
</head>
<body>
  <h1>🏰 타워 디펜스</h1>
  <div id="hud">
    <span id="gold">💰 골드: <span class="val" id="goldVal">100</span></span>
    <span id="lives">❤️ 생명: <span class="val" id="livesVal">10</span></span>
    <span id="wave">🌊 웨이브: <span class="val" id="waveVal">0</span> / 10</span>
  </div>
  <div id="canvasWrap">
    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="overlay">
      <div class="big">🏰 타워 디펜스</div>
      <div class="hint">
        길을 따라 오는 적을 막으세요.<br>
        <b>1) 아래 타워 버튼을 누르고 → 2) 초록 잔디칸을 클릭</b>해 타워를 세웁니다.<br>
        적을 잡으면 골드를 벌고, 그 골드로 타워를 더 짓습니다.<br>
        적이 끝까지 가면 생명이 줄고, 0이 되면 게임 오버!
      </div>
      <button id="startBtn">게임 시작 ▶</button>
    </div>
  </div>
  <div id="controls">
    <button id="towerBasic" class="towerBtn">🔵 기본타워 (25골드)</button>
    <button id="towerSniper" class="towerBtn">🟣 저격타워 (60골드)</button>
    <button id="towerRapid" class="towerBtn">🟢 연사타워 (50골드)</button>
    <button id="cancelBtn">선택 취소</button>
  </div>
  <div id="msg">게임 시작을 눌러주세요.</div>

<script>
// ==========================================================================
//  사운드 엔진 — Web Audio API로 효과음을 코드로 직접 합성 (외부 파일·라이선스 불필요)
// ==========================================================================
const Sound = {
  ctx: null,
  enabled: true,
  bgmTimer: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { this.enabled = false; }
  },
  // 기본 톤 생성기 (파형·주파수·길이·볼륨)
  tone(freq, dur, type='square', vol=0.15, slideTo=null) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur);
  },
  // 노이즈 버스트 (폭발·타격감)
  noise(dur, vol=0.2) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const bufSize = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(gain); gain.connect(this.ctx.destination);
    src.start(t);
  },
  shoot()  { this.tone(660, 0.08, 'square', 0.06, 220); },   // 발사음
  sniper() { this.tone(140, 0.18, 'sawtooth', 0.12, 60); },  // 저격음(묵직)
  hit()    { this.noise(0.12, 0.10); },                       // 적 처치(폭발)
  place()  { this.tone(520, 0.10, 'triangle', 0.12, 780); },  // 타워 설치(상승)
  click()  { this.tone(400, 0.05, 'sine', 0.08); },           // UI 클릭
  waveClear(){ [523,659,784].forEach((f,i)=> setTimeout(()=>this.tone(f,0.15,'triangle',0.12), i*120)); },
  lose()   { this.tone(200, 0.5, 'sawtooth', 0.15, 60); },    // 생명 감소
  win()    { [523,659,784,1046].forEach((f,i)=> setTimeout(()=>this.tone(f,0.25,'triangle',0.14), i*150)); },
  gameover(){ [400,300,200].forEach((f,i)=> setTimeout(()=>this.tone(f,0.35,'sawtooth',0.14), i*200)); },
  // 배경음악 — 간단한 아르페지오 루프를 코드로 생성
  startBGM() {
    if (!this.enabled || !this.ctx || this.bgmTimer) return;
    const scale = [220, 261.63, 329.63, 392, 440, 392, 329.63, 261.63];
    let i = 0;
    this.bgmTimer = setInterval(() => {
      if (!this.enabled) return;
      this.tone(scale[i % scale.length], 0.35, 'triangle', 0.035);
      if (i % 2 === 0) this.tone(scale[i % scale.length]/2, 0.7, 'sine', 0.03);
      i++;
    }, 400);
  },
  stopBGM() { if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; } },
  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) this.stopBGM();
    else if (state && state.running && !state.gameOver) this.startBGM();
    return this.enabled;
  }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ==========================================================================
//  스프라이트 로더 — Kenney 타워디펜스 도트 에셋 (CC0)
// ==========================================================================
const SPRITES = {};
const SPRITE_FILES = {
  tower_basic: 'assets/tower_basic.png',
  tower_sniper: 'assets/tower_sniper.png',
  tower_rapid: 'assets/tower_rapid.png',
  enemy_tank: 'assets/enemy_tank.png',
  enemy_plane: 'assets/enemy_plane.png',
  enemy_unit: 'assets/enemy_unit.png',
  bullet: 'assets/bullet.png',
  rocket: 'assets/rocket.png',
  tile_grass: 'assets/tile_grass.png',
  tile_path: 'assets/tile_path.png',
};
let spritesLoaded = 0;
const spritesTotal = Object.keys(SPRITE_FILES).length;
function loadSprites(onDone) {
  for (const [key, src] of Object.entries(SPRITE_FILES)) {
    const img = new Image();
    img.onload = () => { spritesLoaded++; if (spritesLoaded >= spritesTotal && onDone) onDone(); };
    img.onerror = () => { spritesLoaded++; SPRITES[key] = null; if (spritesLoaded >= spritesTotal && onDone) onDone(); };
    img.src = src;
    SPRITES[key] = img;
  }
}
// 스프라이트를 중심 기준으로 그리기 (크기·회전 지원). 로딩 실패 시 폴백 도형.
function drawSprite(key, x, y, size, angle) {
  const img = SPRITES[key];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.translate(x, y);
    if (angle) ctx.rotate(angle);
    ctx.drawImage(img, -size/2, -size/2, size, size);
    ctx.restore();
    return true;
  }
  return false; // 폴백은 호출부에서 처리
}
const TILE = 40;
const COLS = 16, ROWS = 12;

// 적이 지나가는 경로 (타일 좌표). 이 칸들 위엔 타워를 못 짓는다.
const PATH = [
  {x:0,y:2},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:5,y:2},
  {x:5,y:3},{x:5,y:4},{x:5,y:5},{x:5,y:6},
  {x:6,y:6},{x:7,y:6},{x:8,y:6},{x:9,y:6},{x:10,y:6},
  {x:10,y:5},{x:10,y:4},{x:10,y:3},
  {x:11,y:3},{x:12,y:3},{x:13,y:3},{x:14,y:3},{x:15,y:3}
];
const pathSet = new Set(PATH.map(p => p.x + ',' + p.y));
// 경로를 픽셀 중심 좌표로 변환 (적 이동용)
const waypoints = PATH.map(p => ({ x: p.x*TILE + TILE/2, y: p.y*TILE + TILE/2 }));

// 타워 종류 정의
const TOWER_TYPES = {
  basic:  { name:'기본', cost:25, range:90,  dmg:10, rate:45, color:'#4a9eff', proj:'#7fd1ff' },
  sniper: { name:'저격', cost:60, range:180, dmg:40, rate:110, color:'#a86eff', proj:'#c9a3ff' },
  rapid:  { name:'연사', cost:50, range:75,  dmg:5,  rate:14, color:'#4fd6a0', proj:'#8affc9' },
};

let state = null;

function newState() {
  return {
    gold: 100, lives: 10, wave: 0, maxWave: 10,
    towers: [], enemies: [], projectiles: [], particles: [],
    selectedType: null,
    running: false, gameOver: false, win: false,
    spawnQueue: [], spawnTimer: 0, waveActive: false,
    frame: 0,
  };
}

// ---- 웨이브(적 무리) 생성 ----
function startWave() {
  if (state.waveActive || state.gameOver) return;
  state.wave++;
  if (state.wave > state.maxWave) return;
  state.waveActive = true;
  const count = 5 + state.wave * 2;          // 웨이브마다 적 수 증가
  const hp = 20 + state.wave * 12;           // 체력 증가
  const speed = 0.6 + state.wave * 0.05;     // 속도 증가
  const reward = 8 + state.wave;             // 처치 보상
  state.spawnQueue = [];
  for (let i = 0; i < count; i++) {
    state.spawnQueue.push({ hp, maxHp: hp, speed, reward });
  }
  state.spawnTimer = 0;
  setMsg('웨이브 ' + state.wave + ' 시작! 적 ' + count + '마리가 몰려옵니다.');
}

function spawnEnemy(tmpl) {
  // 웨이브에 따라 적 외형을 다르게 (탱크/유닛/비행기)
  const kinds = ['enemy_unit', 'enemy_tank', 'enemy_plane'];
  const kind = kinds[Math.min(kinds.length-1, Math.floor((state.wave-1)/3))];
  state.enemies.push({
    x: waypoints[0].x, y: waypoints[0].y,
    wp: 1, hp: tmpl.hp, maxHp: tmpl.maxHp,
    speed: tmpl.speed, reward: tmpl.reward,
    sprite: kind, angle: 0,
  });
}

// 파티클 생성 헬퍼 (폭발·발사 이펙트)
function spawnParticles(x, y, color, count, speedRange, life) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
    state.particles.push({
      x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life, maxLife: life, color, size: 2 + Math.random()*2,
    });
  }
}

// ---- 매 프레임 업데이트 ----
function update() {
  if (!state.running || state.gameOver) return;
  state.frame++;

  // 적 소환 (약간의 간격을 두고)
  if (state.waveActive && state.spawnQueue.length > 0) {
    state.spawnTimer--;
    if (state.spawnTimer <= 0) {
      spawnEnemy(state.spawnQueue.shift());
      state.spawnTimer = 35;
    }
  }

  // 적 이동
  for (const e of state.enemies) {
    const target = waypoints[e.wp];
    if (!target) { continue; }
    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < e.speed * 2) {
      e.wp++;
      if (e.wp >= waypoints.length) {
        e.reached = true; // 끝에 도달
      }
    } else {
      e.x += (dx/dist) * e.speed * 2;
      e.y += (dy/dist) * e.speed * 2;
      e.angle = Math.atan2(dy, dx) + Math.PI/2; // 진행 방향 바라보기
    }
  }

  // 끝에 도달한 적 처리 (생명 감소)
  for (const e of state.enemies) {
    if (e.reached) {
      state.lives--;
      e.dead = true;
      Sound.lose(); // 생명 감소 경고음
      if (state.lives <= 0) { state.lives = 0; endGame(false); }
    }
  }

  // 타워 사격
  for (const t of state.towers) {
    t.cool = (t.cool || 0) - 1;
    if (t.cool > 0) continue;
    // 사거리 안, 가장 앞선 적을 조준
    let target = null, best = -1;
    for (const e of state.enemies) {
      if (e.dead || e.hp <= 0) continue;
      const d = Math.hypot(e.x - t.px, e.y - t.py);
      if (d <= t.range && e.wp > best) { best = e.wp; target = e; }
    }
    if (target) {
      state.projectiles.push({
        x: t.px, y: t.py, target, dmg: t.dmg, color: t.proj, speed: 6,
        sprite: (t.rate >= 100 ? 'rocket' : 'bullet'),
        angle: Math.atan2(target.y - t.py, target.x - t.px) + Math.PI/2,
      });
      t.cool = t.rate;
      t.angle = Math.atan2(target.y - t.py, target.x - t.px) + Math.PI/2; // 타워가 적 조준
      // 발사음 (타워 종류별로 다른 소리)
      if (t.rate >= 100) Sound.sniper();
      else Sound.shoot();
      // 발사 머즐 플래시 파티클
      spawnParticles(t.px, t.py, t.proj, 4, [0.5, 1.5], 12);
    }
  }

  // 총알 이동 & 명중
  for (const p of state.projectiles) {
    if (!p.target || p.target.dead || p.target.hp <= 0) { p.dead = true; continue; }
    const dx = p.target.x - p.x, dy = p.target.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 8) {
      p.target.hp -= p.dmg;
      p.dead = true;
      if (p.target.hp <= 0 && !p.target.counted) {
        p.target.counted = true;
        p.target.dead = true;
        state.gold += p.target.reward;
        Sound.hit(); // 처치 폭발음
        spawnParticles(p.target.x, p.target.y, '#ff7043', 14, [1, 3.5], 22); // 폭발 파티클
      }
    } else {
      p.x += (dx/d) * p.speed;
      p.y += (dy/d) * p.speed;
    }
  }

  // 파티클 업데이트 (이동 + 수명 감소)
  for (const pt of state.particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.92; pt.vy *= 0.92; // 감속
    pt.life--;
    if (pt.life <= 0) pt.dead = true;
  }

  // 죽은 객체 정리
  state.enemies = state.enemies.filter(e => !e.dead);
  state.projectiles = state.projectiles.filter(p => !p.dead);
  state.particles = state.particles.filter(p => !p.dead);

  // 웨이브 종료 판정
  if (state.waveActive && state.spawnQueue.length === 0 && state.enemies.length === 0) {
    state.waveActive = false;
    state.gold += 20; // 웨이브 클리어 보너스
    if (state.wave >= state.maxWave) {
      endGame(true);
    } else {
      Sound.waveClear(); // 웨이브 클리어 팡파레
      updateWaveButton(); // 버튼을 "다음 웨이브"로 갱신
      setMsg('✅ 웨이브 ' + state.wave + ' 클리어! +20골드. 준비되면 "다음 웨이브"를 누르세요.');
    }
  }

  updateHUD();
}

// ---- 그리기 ----
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // 잔디/길 배경 — 스프라이트 타일 (로딩 실패 시 색으로 폴백)
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    const onPath = pathSet.has(x+','+y);
    const key = onPath ? 'tile_path' : 'tile_grass';
    const img = SPRITES[key];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x*TILE, y*TILE, TILE, TILE);
    } else {
      ctx.fillStyle = onPath ? '#6b5842' : ((x+y)%2 ? '#3a7a3a' : '#357035');
      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }
  // 시작/끝 표시
  const s = waypoints[0], en = waypoints[waypoints.length-1];
  ctx.fillStyle = '#4fd6a0'; ctx.fillRect(s.x-TILE/2, s.y-TILE/2, TILE, 5);
  ctx.fillStyle = '#ff6b6b'; ctx.fillRect(en.x-TILE/2, en.y-TILE/2, TILE, 5);

  // 배치 미리보기 (타워 선택 시 마우스칸 하이라이트)
  if (state.selectedType && hoverTile) {
    const {tx,ty} = hoverTile;
    const ok = canPlace(tx,ty);
    ctx.fillStyle = ok ? 'rgba(79,214,160,.35)' : 'rgba(255,107,107,.35)';
    ctx.fillRect(tx*TILE, ty*TILE, TILE, TILE);
    if (ok) {
      const r = TOWER_TYPES[state.selectedType].range;
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(tx*TILE+TILE/2, ty*TILE+TILE/2, r, 0, Math.PI*2); ctx.stroke();
    }
  }

  // 타워 (도트 스프라이트, 적 조준 방향으로 회전)
  for (const t of state.towers) {
    if (!drawSprite(t.sprite, t.px, t.py, 34, t.angle || 0)) {
      // 폴백: 도형
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(t.px, t.py, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1d29';
      ctx.beginPath(); ctx.arc(t.px, t.py, 6, 0, Math.PI*2); ctx.fill();
    }
  }

  // 적 (도트 스프라이트, 진행 방향으로 회전 + 체력바)
  for (const e of state.enemies) {
    if (!drawSprite(e.sprite, e.x, e.y, 30, e.angle || 0)) {
      // 폴백: 도형
      ctx.fillStyle = '#ff7043';
      ctx.beginPath(); ctx.arc(e.x, e.y, 11, 0, Math.PI*2); ctx.fill();
    }
    // 체력바 (스프라이트 위에)
    const w = 24, r = Math.max(0, e.hp/e.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x-w/2, e.y-22, w, 4);
    ctx.fillStyle = r>0.5?'#4fd6a0':(r>0.25?'#ffd45e':'#ff6b6b');
    ctx.fillRect(e.x-w/2, e.y-22, w*r, 4);
  }

  // 총알/로켓 (도트 스프라이트, 진행 방향 회전)
  for (const p of state.projectiles) {
    // 총알이 타겟을 향하도록 각도 갱신
    if (p.target && !p.target.dead) {
      p.angle = Math.atan2(p.target.y - p.y, p.target.x - p.x) + Math.PI/2;
    }
    if (!drawSprite(p.sprite, p.x, p.y, 16, p.angle || 0)) {
      // 폴백: 글로우 점
      const pg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 6);
      pg.addColorStop(0, '#fff'); pg.addColorStop(0.4, p.color); pg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
    }
  }

  // 파티클 (발사 플래시 · 폭발)
  for (const pt of state.particles) {
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * alpha, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- 배치 가능 여부 ----
function canPlace(tx, ty) {
  if (tx<0||ty<0||tx>=COLS||ty>=ROWS) return false;
  if (pathSet.has(tx+','+ty)) return false;
  for (const t of state.towers) if (t.tx===tx && t.ty===ty) return false;
  if (!state.selectedType) return false;
  return state.gold >= TOWER_TYPES[state.selectedType].cost;
}

// ---- 상호작용 ----
let hoverTile = null;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left) / TILE);
  const ty = Math.floor((e.clientY - r.top) / TILE);
  hoverTile = {tx, ty};
});
canvas.addEventListener('mouseleave', () => hoverTile = null);
canvas.addEventListener('click', e => {
  if (!state.running || !state.selectedType) return;
  const r = canvas.getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left) / TILE);
  const ty = Math.floor((e.clientY - r.top) / TILE);
  if (!canPlace(tx,ty)) {
    setMsg(pathSet.has(tx+','+ty) ? '길 위에는 타워를 못 세워요!' : '골드가 부족하거나 이미 타워가 있어요.');
    return;
  }
  const type = TOWER_TYPES[state.selectedType];
  state.gold -= type.cost;
  Sound.place(); // 타워 설치음
  spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, type.color, 10, [0.5, 2], 16);
  state.towers.push({
    tx, ty, px: tx*TILE+TILE/2, py: ty*TILE+TILE/2,
    range: type.range, dmg: type.dmg, rate: type.rate,
    color: type.color, proj: type.proj, cool: 0,
    sprite: state.selectedType==='sniper' ? 'tower_sniper' : (state.selectedType==='rapid' ? 'tower_rapid' : 'tower_basic'),
    angle: 0,
  });
  updateHUD();
  setMsg(type.name + '타워 배치! 남은 골드: ' + state.gold);
});

// 타워 선택 버튼
function selectType(type) {
  state.selectedType = type;
  document.querySelectorAll('.towerBtn').forEach(b => b.classList.remove('active'));
  const map = { basic:'towerBasic', sniper:'towerSniper', rapid:'towerRapid' };
  document.getElementById(map[type]).classList.add('active');
  setMsg(TOWER_TYPES[type].name + '타워 선택됨 — 초록 잔디칸을 클릭해 배치하세요.');
}
document.getElementById('towerBasic').onclick = () => { Sound.click(); selectType('basic'); };
document.getElementById('towerSniper').onclick = () => { Sound.click(); selectType('sniper'); };
document.getElementById('towerRapid').onclick = () => { Sound.click(); selectType('rapid'); };
document.getElementById('cancelBtn').onclick = () => {
  Sound.click();
  state.selectedType = null;
  document.querySelectorAll('.towerBtn').forEach(b => b.classList.remove('active'));
  setMsg('선택 취소됨.');
};

// ---- HUD / 메시지 ----
function updateHUD() {
  document.getElementById('goldVal').textContent = state.gold;
  document.getElementById('livesVal').textContent = state.lives;
  document.getElementById('waveVal').textContent = state.wave;
  document.querySelectorAll('.towerBtn').forEach(b => {
    const t = b.id==='towerBasic'?'basic':b.id==='towerSniper'?'sniper':'rapid';
    b.disabled = state.gold < TOWER_TYPES[t].cost;
  });
}
function setMsg(m) { document.getElementById('msg').textContent = m; }

// ---- 게임 시작/종료 ----
const overlay = document.getElementById('overlay');
function beginGame() {
  Sound.init();        // 오디오 컨텍스트 활성화 (사용자 클릭 시점 = 자동재생 정책 통과)
  Sound.startBGM();    // 배경음악 시작
  state = newState();
  state.running = true;
  overlay.classList.add('hidden');
  updateHUD();
  ensureWaveButton();
  updateWaveButton();
  setMsg('🛡️ 준비 시간! 타워를 배치한 뒤, 아래 "웨이브 시작" 버튼을 누르면 적이 옵니다.');
  // 첫 웨이브는 자동 시작하지 않음 — 플레이어가 배치 후 직접 시작
}
function endGame(win) {
  state.gameOver = true;
  state.win = win;
  Sound.stopBGM();
  if (win) Sound.win(); else Sound.gameover();
  overlay.classList.remove('hidden');
  overlay.innerHTML = win
    ? '<div class="big">🎉 승리!</div><div class="hint">10개 웨이브를 모두 막아냈습니다!<br>남은 생명: '+state.lives+'</div><button id="againBtn">다시 하기 🔄</button>'
    : '<div class="big">💥 게임 오버</div><div class="hint">웨이브 '+state.wave+'에서 방어에 실패했습니다.<br>다시 도전해보세요!</div><button id="againBtn">다시 하기 🔄</button>';
  document.getElementById('againBtn').onclick = beginGame;
}
document.getElementById('startBtn').onclick = beginGame;

// 🔊 음소거 토글 버튼
(function addMuteButton(){
  const btn = document.createElement('button');
  btn.id = 'muteBtn';
  btn.textContent = '🔊 소리 켜짐';
  btn.onclick = () => {
    const on = Sound.toggle();
    btn.textContent = on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
  };
  document.getElementById('controls').appendChild(btn);
})();

// "웨이브 시작 / 다음 웨이브" 버튼 — 상황에 따라 텍스트가 바뀜
function ensureWaveButton() {
  if (document.getElementById('nextWaveBtn')) return;
  const btn = document.createElement('button');
  btn.id = 'nextWaveBtn';
  btn.onclick = () => {
    if (state.gameOver) return;
    if (!state.waveActive && state.wave < state.maxWave) {
      Sound.click();
      startWave();
      updateWaveButton();
    }
  };
  document.getElementById('controls').appendChild(btn);
}
// 버튼 상태 갱신: 준비중이면 강조된 "웨이브 시작", 진행중이면 비활성
function updateWaveButton() {
  const btn = document.getElementById('nextWaveBtn');
  if (!btn || !state) return;
  if (state.waveActive) {
    btn.textContent = '⚔️ 웨이브 ' + state.wave + ' 진행 중...';
    btn.disabled = true;
    btn.style.background = '#555a6e';
  } else if (state.wave >= state.maxWave) {
    btn.textContent = '마지막 웨이브';
    btn.disabled = true;
    btn.style.background = '#555a6e';
  } else {
    const next = state.wave + 1;
    btn.textContent = (state.wave === 0 ? '▶ 웨이브 시작!' : '▶ 다음 웨이브 (' + next + '/' + state.maxWave + ')');
    btn.disabled = false;
    btn.style.background = '#2e7d5b';
    btn.style.outline = '2px solid #4fd6a0';
  }
}

// ---- 메인 루프 ----
function loop() {
  if (state) { update(); draw(); }
  requestAnimationFrame(loop);
}
state = newState();
loadSprites(() => { /* 로딩 완료 후 자동으로 스프라이트가 그려짐 */ });
draw();
loop();
</script>
